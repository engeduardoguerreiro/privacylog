name: APK Android (TWA)

# Compila o app Android que abre o PrivacyLog em tela cheia.
# Disparo manual: aba Actions > "APK Android (TWA)" > Run workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versao visivel do app (ex.: 1.0.0)"
        required: false
        default: "1.0.0"
      version_code:
        description: "Codigo interno da versao (inteiro, sempre maior que o anterior)"
        required: false
        default: "1"
      publish:
        description: "Publicar o APK em Releases (para download no site)"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Aponta o Bubblewrap para o JDK/SDK (evita prompts)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_SDK_ROOT" \
            > "$HOME/.bubblewrap/config.json"

      - name: Aplica a versao informada
        working-directory: android
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            m.appVersion = process.env.V || m.appVersion;
            m.appVersionCode = Number(process.env.VC || m.appVersionCode);
            fs.writeFileSync("twa-manifest.json", JSON.stringify(m, null, 2));
            console.log("versao:", m.appVersion, "codigo:", m.appVersionCode);
          '
        env:
          V: ${{ inputs.version }}
          VC: ${{ inputs.version_code }}

      - name: Restaura a chave de assinatura
        working-directory: android
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 nao configurado. Veja docs/APK_ANDROID.md"
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > privacylog.keystore
          echo "keystore restaurado ($(stat -c%s privacylog.keystore) bytes)"

      - name: Compila e assina o APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx --yes @bubblewrap/cli@latest build

      - name: Renomeia o APK
        working-directory: android
        run: |
          ls -la *.apk *.aab 2>/dev/null || true
          cp app-release-signed.apk privacylog.apk
          echo "APK pronto: $(stat -c%s privacylog.apk) bytes"

      - name: Remove a chave do runner
        if: always()
        working-directory: android
        run: rm -f privacylog.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: privacylog-apk
          path: |
            android/privacylog.apk
            android/app-release-bundle.aab

      - name: Publica em Releases (link fixo para o site)
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ inputs.version }}
          name: PrivacyLog app ${{ inputs.version }}
          body: |
            App Android do PrivacyLog (TWA) — abre www.privacylog.com.br em tela cheia.
            O conteudo do app atualiza sozinho a cada deploy do site.
          files: android/privacylog.apk
          make_latest: true
